[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secpipe"
version = "0.3.0"                 # Fase 3 — auto-fix DRV (fix/verify/abstention/memoria)
description = "Motor de segurança operado por IA — a melhor esteira DevSecOps de custo zero"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pablo de Souza Galerani" }]
# pyyaml só é necessário se o consumidor usa .secpipe.yml; o modo zero-config não precisa.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
secpipe = "secpipe.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/secpipe"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "B", "S", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]   # testes usam asserts e chamam git/subprocess
# secpipe roda scanners como subprocesso — é o propósito do motor. A execução é segura e centralizada
# em adapters/base.py::run_tool (argumentos em lista, shell=False, binário resolvido por caminho
# absoluto). Decisão revisada e DOCUMENTADA no nível de projeto, não supressão inline (ADR-0008/FEAT-003).
"src/secpipe/adapters/base.py" = ["S603", "S607"]
# init/hook invocam git e gitleaks (dev tools bem-conhecidos) por nome, em contexto controlado.
"src/secpipe/application/use_cases/init.py" = ["S603", "S607"]
"src/secpipe/application/use_cases/precommit.py" = ["S603", "S607"]
"src/secpipe/application/use_cases/verify.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests"]
# subprocess legítimo e seguro (ver adapters/base.py::run_tool) — decisão revisada, não inline.
# B404 (import subprocess), B603 (call sem shell), B607 (path parcial — resolvido por which).
skips = ["B404", "B603", "B607"]
