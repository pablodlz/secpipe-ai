[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secpipe"
version = "0.0.0"                 # Fase 0 — fundação + esqueleto
description = "Motor de segurança operado por IA — a melhor esteira DevSecOps de custo zero"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pablo de Souza Galerani" }]
# pyyaml só é necessário se o consumidor usa .secpipe.yml; o modo zero-config não precisa.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
secpipe = "secpipe.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "bandit>=1.7", "pip-audit>=2.7", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/secpipe"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "B", "S", "I", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests"]
