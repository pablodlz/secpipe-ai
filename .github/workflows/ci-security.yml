# Dogfooding (ADR-0009): o secpipe roda a esteira EM SI MESMO + supply-chain do próprio repo.
# NOTA: as actions abaixo usam tags por legibilidade; em produção, PINAR POR SHA
#       (StepSecurity Secure-Repo automatiza isso — ver docs/specs/03-security.md).
name: ci-security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read            # least-privilege
jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2   # egress-monitoring do runner (free)
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel   # corrige vuln de setuptools do runner
      - run: python -m pip install -e ".[dev]"
      - name: Lint (ruff, inclui S/bandit)
        run: ruff check src tests
      - name: Type check (mypy strict)
        run: mypy src
      - name: SAST (bandit)
        run: bandit -q -c pyproject.toml -r src   # usa os skips revisados do pyproject (B404/B603/B607)
      - name: SCA (pip-audit)
        run: pip-audit
      - name: Tests (unit + architecture)
        run: pytest -q
      - name: Dogfood — secpipe em si mesmo
        run: python -m secpipe.cli scan .
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
  # NOTA: OpenSSF Scorecard (postura de supply-chain) volta como workflow dedicado com a action
  # PINADA POR SHA (a tag @v2 não resolve). Ver docs/specs/03-security.md.
