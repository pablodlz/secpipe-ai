# Dogfooding (ADR-0009): o secpipe roda a esteira EM SI MESMO.
# Actions PINADAS POR SHA (supply-chain — docs/specs/03-security.md); o comentário mostra a versão legível.
name: ci-security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
permissions:
  contents: read            # least-privilege
jobs:
  quality-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with: { python-version: "3.11" }
      - run: python -m pip install --upgrade pip setuptools wheel   # corrige vuln de setuptools do runner
      - run: python -m pip install -e ".[dev]"
      - name: Lint (ruff, inclui S/bandit)
        run: ruff check src tests
      - name: Type check (mypy strict)
        run: mypy src
      - name: SAST (bandit)
        run: bandit -q -c pyproject.toml -r src   # usa os skips revisados do pyproject (B404/B603/B607)
      - name: SCA (pip-audit)
        run: pip-audit
      - name: Tests (unit + architecture)
        run: pytest -q
      - name: Dogfood — secpipe em si mesmo
        run: python -m secpipe.cli scan .
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
