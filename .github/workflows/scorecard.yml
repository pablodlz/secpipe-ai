# OpenSSF Scorecard — postura de supply-chain do repo (18+ checks). Workflow dedicado (separado do CI).
# Actions PINADAS POR SHA. Roda semanalmente, em push na main, e sob demanda.
name: scorecard
on:
  schedule:
    - cron: "0 6 * * 1"     # toda segunda 06:00 UTC
  push:
    branches: [main]
  workflow_dispatch:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # subir o SARIF para o code scanning
      id-token: write          # publish_results (assinatura OIDC)
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with: { persist-credentials: false }
      - name: Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: { name: scorecard-results, path: results.sarif, retention-days: 5 }
      - name: Upload SARIF (code scanning)
        uses: github/codeql-action/upload-sarif@c16c0f3f2812ec4bb3750a5ed64873fe2ce0fbef  # codeql-action
        with: { sarif_file: results.sarif }
