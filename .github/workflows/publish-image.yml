# Publica a imagem do motor no GitHub Container Registry (ghcr.io/pablodlz/secpipe-ai).
# Dispara ao criar uma tag vX.Y.Z (ou manualmente). NÃO precisa de Docker local — o CI faz o build.
# NOTA: em produção, PINAR as actions por SHA (StepSecurity Secure-Repo automatiza).
name: publish-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write        # necessário para o push no ghcr
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - name: Login no ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadados (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
