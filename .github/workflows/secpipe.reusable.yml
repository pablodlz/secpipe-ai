# Modo A (referenciado): outro projeto consome ASSIM, pinando a tag/SHA:
#   jobs: { secpipe: { uses: pablodlz/secpipe-ai/.github/workflows/secpipe.reusable.yml@v1 } }
# Roda a IMAGEM publicada (todos os scanners embutidos: gitleaks/semgrep/trivy/bandit/pip-audit).
name: secpipe-reusable
on:
  workflow_call:
    inputs:
      target: { type: string, default: "." }
      config: { type: string, default: ".secpipe.yml" }
      # Imagem PINADA POR DIGEST (threat model S1: "pin por digest/SHA", não tag móvel) — assim `@v1`
      # entrega {workflow + motor} reproduzíveis. Os DBs de vuln (trivy/semgrep) são baixados em runtime,
      # então a detecção continua atual mesmo com a imagem pinada. Refresque o digest a cada release do motor.
      # Bleeding-edge: o consumidor pode sobrescrever este input com "...:latest".
      image:  { type: string, default: "ghcr.io/pablodlz/secpipe-ai@sha256:97465550a74de5de4e7dda7190f3b893353c8dfec39c12739ec6123149a70b73" }
    # secrets: (Fase 3) chaves de IA para o auto-fix, passadas pelo consumidor
permissions:
  contents: read
jobs:
  secpipe:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: secpipe scan (via imagem — todos os scanners)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            "${{ inputs.image }}" scan "${{ inputs.target }}" --config "${{ inputs.config }}"
