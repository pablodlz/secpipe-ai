# DAST opt-in (OWASP ZAP baseline) — o consumidor chama contra um app JÁ RODANDO (deploy/preview):
#   jobs:
#     dast:
#       uses: pablodlz/secpipe-ai/.github/workflows/secpipe-dast.reusable.yml@v1
#       with: { target: "https://staging.meu-app.com" }
# O ZAP roda como container (o runner do CI tem docker); o secpipe NORMALIZA o relatório e aplica o MESMO gate.
name: secpipe-dast-reusable
on:
  workflow_call:
    inputs:
      target:    { type: string, required: true }              # URL do app no ar (obrigatório p/ DAST)
      config:    { type: string, default: ".secpipe.yml" }
      mode:      { type: string, default: "baseline" }          # baseline (passivo) | full (active scan)
      # Imagem do secpipe PINADA POR DIGEST (repinada a cada release; precisa conter `dast-import`).
      image:     { type: string, default: "ghcr.io/pablodlz/secpipe-ai@sha256:97465550a74de5de4e7dda7190f3b893353c8dfec39c12739ec6123149a70b73" }
      zap_image: { type: string, default: "ghcr.io/zaproxy/zaproxy:stable" }
permissions:
  contents: read
jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: ZAP (DAST) contra o alvo
        env:
          ZAP_SCRIPT: ${{ inputs.mode == 'full' && 'zap-full-scan.py' || 'zap-baseline.py' }}
        run: |
          mkdir -p zap-out
          # `|| true`: o ZAP sai != 0 quando ACHA algo (queremos que o secpipe faca o gate, nao o ZAP).
          docker run --rm -v "${{ github.workspace }}/zap-out:/zap/wrk:rw" \
            "${{ inputs.zap_image }}" "$ZAP_SCRIPT" -t "${{ inputs.target }}" -J report.json -I || true
          # FAIL-CLOSED: se o ZAP NAO gerou relatorio, foi falha de execucao -> reprova (nao passa em silencio).
          test -s zap-out/report.json || { echo "::error::ZAP nao gerou relatorio (falha de execucao)"; exit 1; }
      - name: secpipe — normaliza o relatorio e aplica o gate
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work \
            "${{ inputs.image }}" dast-import "zap-out/report.json" --config "${{ inputs.config }}"
